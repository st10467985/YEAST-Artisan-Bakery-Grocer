<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>YEAST Artisan Bakery &amp; Grocer - Enquiry</title>
</head>

<body>

    <header>
        <h1>YEAST Artisan Bakery &amp; Grocer</h1>

        <!-- Main navigation -->
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="products.html">Products</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <!-- Product and service enquiry -->
        <h2>Product / Service Enquiry</h2>

        <!-- Enquiry form -->
        <form>

            <!-- Customer name -->
            <p>
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name">
            </p>

            <!-- Customer contact details -->
            <p>
                <label for="contact">Email / Phone:</label><br>
                <input type="text" id="contact" name="contact">
            </p>

            <!-- Product requested -->
            <p>
                <label for="product">Product Requested:</label><br>
                <input type="text" id="product" name="product">
            </p>

            <!-- Product quantity -->
            <p>
                <label for="quantity">Quantity:</label><br>
                <input type="number" id="quantity" name="quantity" min="1">
            </p>

            <!-- Customer message -->
            <p>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="6" cols="40"></textarea>
            </p>

            <!-- Submit enquiry -->
            <p>
                <button type="submit">Submit Enquiry</button>
            </p>

        </form>

    </main>

    <!-- Footer -->
    <footer>
        <p>YEAST Artisan Bakery &amp; Grocer</p>
        <p>Contact | Social Media | Opening Hours</p>
    </footer>

</body>
</html>
