
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>YEAST Artisan Bakery &amp; Grocer - Enquiry</title>
</head>

<body>

    <header>
        <h1>YEAST Artisan Bakery &amp; Grocer</h1>

        <!-- Main navigation -->
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="products.html">Products</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <!-- Product and service enquiry -->
        <h2>Product / Service Enquiry</h2>

        <!-- Enquiry form -->
        <form id="enquiryForm" action="#" method="post">

            <!-- Customer name -->
            <p>
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name"
                       required minlength="2" maxlength="60">
            </p>

            <!-- Customer email -->
            <p>
                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" required>
            </p>

            <!-- Customer phone number -->
            <p>
                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone"
                       required pattern="[0-9+() -]{10,15}"
                       title="Enter a valid phone number.">
            </p>

            <!-- Enquiry type -->
            <p>
                <label for="enquiryType">Enquiry Type:</label><br>
                <select id="enquiryType" name="enquiryType" required>
                    <option value="">Select an enquiry type</option>
                    <option value="Product">Product</option>
                    <option value="Service">Service</option>
                    <option value="Volunteering">Volunteering</option>
                    <option value="Sponsorship">Sponsorship</option>
                </select>
            </p>

            <!-- Product requested -->
            <p>
                <label for="product">Product / Service Requested:</label><br>
                <input type="text" id="product" name="product"
                       required minlength="2" maxlength="100">
            </p>

            <!-- Product quantity -->
            <p>
                <label for="quantity">Quantity:</label><br>
                <input type="number" id="quantity" name="quantity"
                       min="1" max="100" value="1" required>
            </p>

            <!-- Customer message -->
            <p>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message"
                          rows="6" cols="40"
                          minlength="10" maxlength="500"
                          required></textarea>
            </p>

            <!-- Submit enquiry -->
            <p>
                <button type="submit">Submit Enquiry</button>
            </p>

        </form>

        <!-- Enquiry response -->
        <div id="enquiryResponse" role="status" aria-live="polite"></div>

    </main>

    <!-- Footer -->
    <footer>
        <p>YEAST Artisan Bakery &amp; Grocer</p>
        <p>Contact | Social Media | Opening Hours</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
